{% extends "base.html" %}

{% block naslov %}Uredi simptom{% endblock %}

{% block vsebina %}
<div class="stran-ozka">
<h2>Uredi vrsto simptoma</h2>

<form method="post" class="obrazec">
    <input type="hidden" name="csrf_zeton" value="{{ csrf_zeton() }}">

    <label for="naziv">Naziv</label>
    <input type="text" id="naziv" name="naziv" required value="{{ simptom.naziv }}">

    <button type="submit">Shrani</button>
</form>

<p><a href="{{ url_for('simptomi') }}">Nazaj na seznam</a></p>
</div>
{% endblock %}
