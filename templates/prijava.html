{% extends "base.html" %}

{% block naslov %}Prijava{% endblock %}

{% block vsebina %}
<h2>Prijava</h2>

<form method="post">
    <label for="uporabnisko_ime">Uporabniško ime</label>
    <input type="text" id="uporabnisko_ime" name="uporabnisko_ime" required>

    <label for="geslo">Geslo</label>
    <input type="password" id="geslo" name="geslo" required>

    <button type="submit">Prijava</button>
</form>

<p><a href="{{ url_for('registracija') }}">Še nimaš računa? Registriraj se.</a></p>
{% endblock %}
