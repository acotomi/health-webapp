{% extends "base.html" %}

{% block naslov %}Prijava{% endblock %}

{% block vsebina %}
<div class="stran-ozka">
<h2>Prijava</h2>

<form method="post" class="obrazec">
    <input type="hidden" name="csrf_zeton" value="{{ csrf_zeton() }}">

    <label for="uporabnisko_ime">Uporabniško ime</label>
    <input type="text" id="uporabnisko_ime" name="uporabnisko_ime" autocomplete="username" required>

    <label for="geslo">Geslo</label>
    <input type="password" id="geslo" name="geslo" autocomplete="current-password" required>

    <button type="submit">Prijava</button>
</form>

<p><a href="{{ url_for('registracija') }}">Še nimate računa? Registrirajte se.</a></p>
</div>
{% endblock %}
