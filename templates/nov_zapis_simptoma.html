{% extends "base.html" %}

{% block naslov %}Nov zapis simptoma{% endblock %}

{% block vsebina %}
<div class="stran-ozka">
<h2>Nov zapis simptoma</h2>

<form method="post" class="obrazec">
    <input type="hidden" name="csrf_zeton" value="{{ csrf_zeton() }}">

    <label for="simptom_id">1. Simptom</label>
    <select id="simptom_id" name="simptom_id" required>
        {% for simptom in simptomi %}
        <option value="{{ simptom.id }}">{{ simptom.naziv }}</option>
        {% endfor %}
    </select>

    <label for="jakost">2. Jakost (0 = brez, 10 = najhujša): <output id="jakost-vrednost">5</output></label>
    <input type="range" id="jakost" name="jakost" min="0" max="10" value="5" list="jakost-oznake"
           oninput="document.getElementById('jakost-vrednost').textContent = this.value">
    <div class="drsnik-oznake">
        <span>0</span><span>1</span><span>2</span><span>3</span><span>4</span><span>5</span><span>6</span><span>7</span><span>8</span><span>9</span><span>10</span>
    </div>
    <datalist id="jakost-oznake">
        <option value="0"></option><option value="1"></option><option value="2"></option>
        <option value="3"></option><option value="4"></option><option value="5"></option>
        <option value="6"></option><option value="7"></option><option value="8"></option>
        <option value="9"></option><option value="10"></option>
    </datalist>

    <label for="opomba">3. Opomba (neobvezno)</label>
    <textarea id="opomba" name="opomba" rows="3"></textarea>

    <button type="submit">Shrani</button>
</form>
</div>
{% endblock %}
