{% extends "base.html" %}

{% block naslov %}Uredi terapijo{% endblock %}

{% block vsebina %}
<div class="stran-ozka">
<h2>Uredi terapijo</h2>

<form method="post" class="obrazec">
    <input type="hidden" name="csrf_zeton" value="{{ csrf_zeton() }}">

    <label for="naziv">Naziv</label>
    <input type="text" id="naziv" name="naziv" required value="{{ terapija.naziv }}">

    <label for="odmerek">Odmerek (neobvezno)</label>
    <input type="text" id="odmerek" name="odmerek" value="{{ terapija.odmerek or '' }}">

    <label for="pogostost">Pogostost (neobvezno)</label>
    <input type="text" id="pogostost" name="pogostost" value="{{ terapija.pogostost or '' }}">

    <button type="submit">Shrani</button>
</form>

<p><a href="{{ url_for('terapije') }}">Nazaj na seznam</a></p>
</div>
{% endblock %}
